---
# deploy.yml - Deploy/update a shared fvmw endpoint on OpenShift
#
# Usage:
#   ansible-playbook deploy.yml -e @../../local.env
#   ansible-playbook deploy.yml -e @../../local.env -e fvmw_action=teardown
#
# Required variables (set in local.env):
#   cluster_domain: apps.cluster.example.com
#   fvmw_namespace: fvmw
#   fvmw_image: quay.io/rhpds/fvmw:latest
#   fvmw_password: changeme
#   fvmw_num_users: 60
#   fvmw_replicas: 6

- name: Deploy fvmw to OpenShift
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    fvmw_action: deploy
    fvmw_namespace: fvmw
    fvmw_image: quay.io/rhpds/fvmw:latest
    fvmw_password: password
    fvmw_num_users: 60
    fvmw_replicas: 6
    cluster_domain: ""
    fvmw_endpoint_host: "vcenter.{{ cluster_domain }}"
    storage_class: ""
    fvmw_disk_pvc: fvmw-disks
    fvmw_deployment_name: vcenter
    fvmw_service_name: vcenter
    fvmw_route_name: vcenter
    k8s_kubeconfig: ""

  environment:
    K8S_AUTH_KUBECONFIG: "{{ k8s_kubeconfig | default(omit, true) }}"

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - cluster_domain | length > 0
          - (fvmw_num_users | int) > 0
        fail_msg: "cluster_domain and fvmw_num_users must be set. See local.env.example."

    - name: Ensure namespace exists
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ fvmw_namespace }}"
        state: present
      when: fvmw_action == 'deploy'

    - name: Create shared disk PVC
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: "{{ fvmw_disk_pvc }}"
            namespace: "{{ fvmw_namespace }}"
          spec:
            accessModes:
              - ReadWriteMany
            resources:
              requests:
                storage: 100Gi
            storageClassName: "{{ storage_class if storage_class else omit }}"
      when: fvmw_action == 'deploy'

    - name: Create fvmw credentials Secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: fvmw-credentials
            namespace: "{{ fvmw_namespace }}"
          type: Opaque
          stringData:
            password: "{{ fvmw_password }}"
      when: fvmw_action == 'deploy'

    - name: Create shared fvmw Deployment
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ fvmw_deployment_name }}"
            namespace: "{{ fvmw_namespace }}"
            labels:
              app: fvmw
          spec:
            replicas: "{{ fvmw_replicas }}"
            selector:
              matchLabels:
                app: fvmw
            template:
              metadata:
                labels:
                  app: fvmw
              spec:
                containers:
                  - name: fvmw
                    image: "{{ fvmw_image }}"
                    ports:
                      - containerPort: 8080
                        protocol: TCP
                    env:
                      - name: FVMW_LISTEN_ADDR
                        value: ":8080"
                      - name: FVMW_DISK_PATH
                        value: "/disks"
                      - name: FVMW_EXTERNAL_HOST
                        value: "{{ fvmw_endpoint_host }}"
                      - name: FVMW_HOST
                        value: "{{ fvmw_endpoint_host }}"
                      - name: FVMW_NUM_USERS
                        value: "{{ fvmw_num_users | string }}"
                      - name: FVMW_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: fvmw-credentials
                            key: password
                    volumeMounts:
                      - name: disks
                        mountPath: /disks
                        readOnly: false
                    resources:
                      requests:
                        cpu: 500m
                        memory: 512Mi
                      limits:
                        cpu: "4"
                        memory: 2Gi
                    readinessProbe:
                      httpGet:
                        path: /about
                        port: 8080
                      initialDelaySeconds: 3
                      periodSeconds: 10
                    livenessProbe:
                      httpGet:
                        path: /about
                        port: 8080
                      initialDelaySeconds: 5
                      periodSeconds: 30
                volumes:
                  - name: disks
                    persistentVolumeClaim:
                      claimName: "{{ fvmw_disk_pvc }}"
      when: fvmw_action == 'deploy'

    - name: Create shared fvmw Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ fvmw_service_name }}"
            namespace: "{{ fvmw_namespace }}"
            labels:
              app: fvmw
          spec:
            selector:
              app: fvmw
            ports:
              - port: 8080
                targetPort: 8080
                protocol: TCP
      when: fvmw_action == 'deploy'

    - name: Create shared fvmw Route
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: route.openshift.io/v1
          kind: Route
          metadata:
            name: "{{ fvmw_route_name }}"
            namespace: "{{ fvmw_namespace }}"
            labels:
              app: fvmw
            annotations:
              haproxy.router.openshift.io/timeout: 180s
          spec:
            host: "{{ fvmw_endpoint_host }}"
            to:
              kind: Service
              name: "{{ fvmw_service_name }}"
            port:
              targetPort: 8080
            tls:
              termination: edge
              insecureEdgeTerminationPolicy: Redirect
      when: fvmw_action == 'deploy'

    - name: Teardown shared resources
      when: fvmw_action == 'teardown'
      block:
        - name: Delete Route
          kubernetes.core.k8s:
            api_version: route.openshift.io/v1
            kind: Route
            name: "{{ fvmw_route_name }}"
            namespace: "{{ fvmw_namespace }}"
            state: absent

        - name: Delete Service
          kubernetes.core.k8s:
            api_version: v1
            kind: Service
            name: "{{ fvmw_service_name }}"
            namespace: "{{ fvmw_namespace }}"
            state: absent

        - name: Delete Deployment
          kubernetes.core.k8s:
            api_version: apps/v1
            kind: Deployment
            name: "{{ fvmw_deployment_name }}"
            namespace: "{{ fvmw_namespace }}"
            state: absent

        - name: Delete shared disk PVC
          kubernetes.core.k8s:
            api_version: v1
            kind: PersistentVolumeClaim
            name: "{{ fvmw_disk_pvc }}"
            namespace: "{{ fvmw_namespace }}"
            state: absent

        - name: Delete credentials secret
          kubernetes.core.k8s:
            api_version: v1
            kind: Secret
            name: fvmw-credentials
            namespace: "{{ fvmw_namespace }}"
            state: absent

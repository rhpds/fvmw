# Reference manifest - see deploy/ansible/ for automated deployment.
# To use manually: replace ${CLUSTER_DOMAIN} and ${NUM_USERS}.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcenter
  labels:
    app: fvmw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fvmw
  template:
    metadata:
      labels:
        app: fvmw
    spec:
      containers:
        - name: fvmw
          image: quay.io/rhpds/fvmw:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: FVMW_LISTEN_ADDR
              value: ":8080"
            - name: FVMW_DISK_PATH
              value: "/disks"
            - name: FVMW_EXTERNAL_HOST
              value: "vcenter.${CLUSTER_DOMAIN}"
            - name: FVMW_HOST
              value: "vcenter.${CLUSTER_DOMAIN}"
            - name: FVMW_NUM_USERS
              value: "${NUM_USERS}"
            - name: FVMW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fvmw-credentials
                  key: password
          volumeMounts:
            - name: disks
              mountPath: /disks
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /about
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /about
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: disks
          persistentVolumeClaim:
            claimName: fvmw-disks
            readOnly: true
